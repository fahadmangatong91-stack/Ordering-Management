services:
  postgres_test:
    image: postgres:16
    environment:
      POSTGRES_DB: oms_test
      POSTGRES_USER: oms_user
      POSTGRES_PASSWORD: oms_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oms_user -d oms_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  tests:
    build: .
    command: ["pytest", "-q", "/app/backend/tests"]
    environment:
      AUTH_SECRET_KEY: test-secret-key
      DATABASE_URL: postgresql://oms_user:oms_password@postgres_test:5432/oms_test
      DEFAULT_ADMIN_PASSWORD: admin123
      DEFAULT_STAFF_PASSWORD: staff123
      DEFAULT_VIEWER_PASSWORD: viewer123
      PASSWORD_ITERATIONS: "1000"
    depends_on:
      postgres_test:
        condition: service_healthy
